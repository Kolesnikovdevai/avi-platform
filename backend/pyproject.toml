[project]
name = "avitopulse-backend"
version = "0.1.0"
description = "AvitoPulse modular monolith scaffold"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiogram==3.31.0",
    "alembic==1.20.1",
    "fastapi==0.162.1",
    "psycopg[binary]==3.3.7",
    "pydantic-settings==2.16.2",
    "sqlalchemy==2.1.6",
    "uvicorn[standard]==0.54.0",
]

[project.scripts]
avitopulse-api = "avitopulse.entrypoints.api:main"
avitopulse-worker = "avitopulse.entrypoints.worker:main"
avitopulse-bot = "avitopulse.entrypoints.bot:main"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/avitopulse"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["avitopulse"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["postgres: requires a real local PostgreSQL and applied migrations"]

[dependency-groups]
dev = [
    "httpx2==2.16.0",
    "mypy==2.4.1",
    "pip-audit==2.10.1",
    "pytest==9.2.0",
    "ruff==0.17.3",
]

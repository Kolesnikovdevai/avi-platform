name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.15.0'
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint && pnpm typecheck && pnpm format:check
      - run: pnpm build
      - run: pnpm --filter @avitopulse/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - run: pnpm audit --audit-level=low
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.15.0'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.13.7'
      - run: node scripts/init-local.mjs
      - run: docker compose up -d --wait db
      - working-directory: backend
        run: |
          uv sync --frozen
          uv run --frozen ruff check .
          uv run --frozen ruff format --check .
          uv run --frozen mypy
          uv run --frozen --env-file ../.env alembic upgrade head
          uv run --frozen --env-file ../.env pytest
          uv run --frozen avitopulse-worker --check
          uv run --frozen avitopulse-bot --check
          uv run --frozen pip-audit --local --skip-editable
      - if: always()
        run: docker compose down
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: 'false'
          GITLEAKS_VERSION: '8.30.1'

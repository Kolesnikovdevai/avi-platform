name: avitopulse-local
services:
  db:
    image: postgres:18.6
    environment:
      POSTGRES_DB: avitopulse
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run node scripts/init-local.mjs}
      AVITOPULSE_RUNTIME_PASSWORD: ${AVITOPULSE_RUNTIME_PASSWORD:?Local environment required}
      AVITOPULSE_MIGRATOR_PASSWORD: ${AVITOPULSE_MIGRATOR_PASSWORD:?Local environment required}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./infra/postgres/bootstrap.sql:/docker-entrypoint-initdb.d/010-roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d avitopulse"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: "no"
volumes:
  postgres_data:
